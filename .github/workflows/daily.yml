name: Daily AI News refresh

on:
  schedule:
    - cron: "13 22 * * *"   # 00:13 času Diany (leto, CEST = UTC+2)
    - cron: "13 10 * * *"   # 12:13 času Diany (leto, CEST = UTC+2). V zime oba o hodinu skôr.
  workflow_dispatch:        # umožní spustiť aj ručne tlačidlom

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Write Gemini credentials
        env:
          GEMINI_CREDENTIALS_B64: ${{ secrets.GEMINI_CREDENTIALS_B64 }}
          GEMINI_CREDENTIALS: ${{ secrets.GEMINI_CREDENTIALS }}
        run: |
          if [ -n "$GEMINI_CREDENTIALS_B64" ]; then
            printf '%s' "$GEMINI_CREDENTIALS_B64" | base64 -d > credentials.json
          else
            printf '%s' "$GEMINI_CREDENTIALS" > credentials.json
          fi
          python -c "import json; json.load(open('credentials.json')); print('credentials.json je platný JSON')"

      - name: Run pipeline
        run: python src/pipeline.py

      - name: Commit refreshed data
        run: |
          rm -f credentials.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.json dashboard/data.js data/archive.json data/state.json
          git commit -m "Daily AI News refresh ($(date -u +%Y-%m-%d))" || echo "Žiadne zmeny"
          git pull --no-rebase --no-edit -X ours origin main || true
          git push
