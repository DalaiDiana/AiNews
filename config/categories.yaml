# AI News Monitor — definície kategórií (15)
# definition = text pre triedič (Gemini) — musí mať JASNÚ hranicu voči susedným kategóriám.
# keywords   = zrkadlia VŠETKY pojmy z definície (pomôcka pre pred-filter a keyword fallback).

categories:
  - id: github
    name: "GitHub"
    definition: "Trending and most-starred open-source AI/ML code repositories, libraries, frameworks and developer tools gaining traction. ONLY actual code repositories (assigned from the GitHub source, not by topic)."
    keywords: [github, repository, repo, open-source, open source, stars, starred, trending, library, framework, sdk, toolkit, codebase]

  - id: models
    name: "Models & Releases"
    definition: "Launch or update of a SPECIFIC AI model or generative-media capability: LLMs, image/video/audio/multimodal models, open-weight releases, text-to-speech (TTS), speech-to-text (STT), translation, diffusion image/video generation. The MAIN subject is the model and its capabilities. NOT a company's corporate news (->bigplayers), NOT funding numbers (->business)."
    keywords: [model, release, launch, version, update, llm, open-weight, open weight, multimodal, image generation, video generation, audio model, text-to-speech, tts, speech-to-text, stt, translation, translator, diffusion, gpt, claude, gemini, llama, qwen, mistral, deepseek]

  - id: agents
    name: "Agents & Frameworks"
    definition: "Agentic systems and the developer tooling to build them: autonomous AI agents, MCP (model context protocol), LangChain, LangSmith, LlamaIndex, CrewAI, AutoGen, orchestration, tool use, workflows, and consumer bots like Hermes and OpenClaw. NOT model releases (->models), NOT the memory mechanism itself (->memory)."
    keywords: [agent, agentic, autonomous agent, mcp, model context protocol, langchain, langsmith, llamaindex, crewai, autogen, orchestration, tool use, workflow, hermes, openclaw]

  - id: memory
    name: "Memory"
    definition: "How AI systems STORE and RECALL information: long-term and persistent memory, context windows, retrieval-augmented generation (RAG), vector databases, embeddings stores, and memory products (Mem0, Letta, MemGPT). The MAIN subject is the memory or retrieval mechanism, not the agent or model that uses it."
    keywords: [memory, long-term memory, persistent memory, context window, retrieval, retrieval-augmented generation, rag, vector database, vector db, vector store, embeddings, mem0, letta, memgpt, recall]

  - id: gadgets
    name: "Gadgets"
    definition: "Consumer-facing AI HARDWARE you hold or wear: smart glasses, wearables, AI pins, headsets, earbuds, recording/data-collection devices and AI-enabled consumer electronics. NOT data-center chips/GPUs (->infra), NOT robots (->robotics)."
    keywords: [gadget, wearable, smart glasses, glasses, ar glasses, ai pin, pin, headset, earbuds, smartwatch, recorder, consumer device, consumer hardware]

  - id: robotics
    name: "Robotics"
    definition: "Physical robots powered by AI: humanoids, quadrupeds, robotic arms, manipulation, embodied AI, plus demos and deployments (Unitree, Optimus, Figure, AgiBot, UBTech, Fourier). NOT self-driving vehicles or drones (->autonomous)."
    keywords: [robot, robotics, humanoid, quadruped, robotic arm, manipulation, embodied, embodied ai, unitree, optimus, figure, agibot, ubtech, fourier, dexterous]

  - id: autonomous
    name: "Autonomous Transport"
    definition: "Autonomous MOBILITY: self-driving cars, robotaxis, autonomous trucks, and drones, including tech, pilots and deployments (Waymo, WeRide, Pony.ai, Xpeng, Apollo, lidar). NOT humanoid or industrial robots (->robotics)."
    keywords: [autonomous, self-driving, driverless, robotaxi, autonomous truck, drone, waymo, weride, pony.ai, xpeng, apollo, lidar, adas]

  - id: bigplayers
    name: "Big Players"
    definition: "CORPORATE news of major AI labs and vendors: strategy, leadership, reorganisations, partnerships and product strategy of OpenAI, Anthropic, Google/DeepMind, Meta, Microsoft, Nvidia, xAI, Amazon, Apple, and Chinese players (Baidu, Tencent, ByteDance, Alibaba, DeepSeek, Huawei). NOT a specific model launch (->models), NOT funding/M&A figures (->business)."
    keywords: [openai, anthropic, google, deepmind, meta, microsoft, nvidia, xai, amazon, apple, baidu, tencent, bytedance, alibaba, deepseek, huawei, mistral, cohere, partnership, ceo, leadership, strategy, restructuring]

  - id: infra
    name: "Infrastructure & Compute"
    definition: "The compute and energy backbone of AI: data centers, GPUs, TPUs and accelerators, clusters, cloud capacity, networking, chip fabrication, and power/energy for AI. NOT consumer gadgets (->gadgets)."
    keywords: [data center, datacenter, gpu, tpu, accelerator, compute, cluster, cloud, networking, foundry, chip fab, h100, b200, rubin, power, energy]

  - id: business
    name: "Business & Funding"
    definition: "Money and market moves: funding rounds, valuations, investments, acquisitions, IPOs, revenue, market strategy, and PUBLIC funding calls/grants (EU calls, Horizon Europe, accelerators). The MAIN subject is the deal or the money."
    keywords: [funding, raise, round, valuation, acquisition, ipo, investment, venture, revenue, billion, deal, merger, grant, call, horizon europe, accelerator]

  - id: benchmarks
    name: "Benchmarks & Evaluations"
    definition: "How models are MEASURED and COMPARED: new benchmarks, leaderboards, arenas, evaluation methods, and scores/results (MMLU, GPQA, SWE-bench, LMArena, Artificial Analysis). NOT a model launch itself (->models)."
    keywords: [benchmark, evaluation, eval, leaderboard, arena, score, sota, mmlu, gpqa, swe-bench, lmarena, artificial analysis, test set]

  - id: research
    name: "Science & Research"
    definition: "Scientific papers and real-world APPLICATIONS of AI across science and industry (healthcare, biology, physics, chemistry, materials): genuine findings, methods and use-cases. NOT corporate news (->bigplayers), NOT benchmarks (->benchmarks)."
    keywords: [research, paper, study, science, arxiv, breakthrough, discovery, healthcare, biology, physics, chemistry, materials, application, use case]

  - id: legislation
    name: "Legislation"
    definition: "Laws, regulation, policy, courts and enforcement on AI worldwide: EU AI Act, national rules, lawsuits, copyright cases, governance and compliance actions. NOT ethics debate without a legal step (->ethics)."
    keywords: [law, regulation, policy, ai act, eu ai act, legislation, regulator, compliance, ban, governance, court, lawsuit, copyright case]

  - id: ethics
    name: "Philosophy, Ethics & Safety"
    definition: "AI safety, alignment, interpretability, ethics, bias and fairness, and the broader philosophical debate about AI. Ideas and debate, NOT an enacted law (->legislation)."
    keywords: [safety, alignment, interpretability, ethics, philosophy, bias, fairness, existential risk, responsible ai, transparency, misuse]

  - id: skcz
    name: "Slovakia & Czechia"
    definition: "Articles primarily about the Slovak or Czech AI scene: companies, startups, research, events, policy and people in Slovakia or Czechia. Use this regardless of the article's other topic whenever its MAIN focus is the SK/CZ context."
    keywords: [slovensko, slovak, slovensky, slovenska, slovenske, bratislava, kosice, cesko, czech, cr, praha, brno, cesky, ceska]

# fallback kategória, ak triedič nevie zaradiť
fallback: research
